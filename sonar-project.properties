# Local SonarQube CE scan — used by `docker compose -f
# docker-compose.ci.yml run --rm sonar-scanner` at the workspace root.
# Remote (push/PR) analysis is handled by SonarCloud's auto-analysis on
# tibzejoker, so this file is for LOCAL DEEP SCANS only — coverage,
# cross-file duplication, security hotspots, maintainability rating.
#
# Project key lives in the local SonarQube instance only; no clash with
# the SonarCloud project on the same repo (different server).

sonar.projectKey=brain-local
sonar.projectName=brAIn
sonar.projectVersion=0.1.0

# Scan only the monorepo TypeScript packages. Storeprojects live in
# sibling repos with their own SonarCloud projects.
sonar.sources=packages
sonar.tests=tests,packages

# Test file conventions. `*.test.ts` and `*.spec.ts` are detected as
# tests so they're excluded from main-source metrics (complexity,
# duplication) but still counted for test code coverage.
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,tests/**/*.ts

# Bulk-exclude generated, vendored, and bundled paths. dist/ is the
# tsc output; .testinstall/ is the integration-test mirror; coverage/
# is the v8 report dir itself.
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.d.ts,**/coverage/**,**/.testinstall/**,**/.dev-history/**,**/build/**

# Source encoding — matches the editorconfig default.
sonar.sourceEncoding=UTF-8

# Coverage report — vitest writes lcov here when test:coverage runs.
# Path is relative to this properties file.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
