packages:
  - "packages/*"
  - "nodes/*"
  - "nodes/_dynamic/*"
  # Sister repos checked out alongside brAIn — each contains a
  # domain-specific bundle of nodes. pnpm picks them up via these
  # glob entries so workspace:* refs to @brain/sdk + @brain/core
  # resolve, and `pnpm --filter @brain/node-X ...` reaches them.
  # Missing paths are silently ignored, so cloning a subset works.
  - "../brAIn-perception/nodes/*"
  - "../brAIn-memory/nodes/*"
  - "../brAIn-tools/nodes/*"
  - "../brAIn-llm/nodes/*"
  - "../brAIn-ui/nodes/*"
  - "../brAIn-essentials/nodes/*"
