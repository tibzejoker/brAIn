needs:
  - type: attention
  - type: brain
  - type: chat

nodes:
  # === Attention — LLM-driven ears of the network ===
  # Spawns voice/gaze/intent as child processes on first run, polls the
  # intent correlator, and routes every finalised intent through the LLM
  # to decide whether the consciousness is being addressed.
  - type: attention
    name: attention
    description: "Listens to the intent correlator and forwards addressed utterances to the brain."
    priority: 8
    position:
      x: 200
      y: 300

  # === Brain — consciousness that consumes attention.addressed via brain.input ===
  # Also subscribes to chat.input so typed messages go straight in, and
  # to attention.addressed directly for defence in depth (in case the
  # attention node is later reconfigured to not forward to brain.input).
  - type: brain
    name: consciousness
    description: "Central intelligence. Reads both typed (chat.input) and spoken (brain.input via attention) messages and responds."
    priority: 10
    position:
      x: 600
      y: 300
    subscriptions:
      - topic: "brain.*"
      - topic: "chat.input"
      - topic: "intent.output"
      - topic: "alerts.*"

  # === Human chat — lets you talk to the brain without a mic, and watch its replies ===
  - type: chat
    name: human
    description: "Fallback keyboard interface: same brain, text input."
    priority: 5
    position:
      x: 100
      y: 150
    subscriptions:
      - topic: "chat.response"
      - topic: "brain.output"
      - topic: "intent.output"
      - topic: "attention.response"