# demo-memory — full memory subsystem with chat to interact.
#
# Topology:
#
#   chat ──mem.store/mem.ask──▶ memory-proxy ──memory.store/recall/search──▶ memory
#                                            ──memory-vector.store/search──▶ memory-vector
#                                            ──synth via LLM──▶ mem.response ──▶ chat
#
#   cron(10m) ──memory.maintenance.tick──▶ memory-consolidator ──memory.maintenance.log
#
# Open the chat UI (left panel of the dashboard) and type things like:
#   "remember: I like olive trees"
#   "what do I like?"
# memory-proxy fans out to the KV + vector stores and replies back.

needs:
  - type: memory
  - type: memory-vector
  - type: memory-proxy
  - type: memory-consolidator
  - type: chat
  - type: cron

nodes:
  # === Human chat — the user types here ===
  - type: chat
    name: human
    description: "Chat UI. Pick mem.ask or mem.store from the topic dropdown to send queries; replies arrive on mem.response."
    priority: 5
    position: { x: 50, y: 350 }
    subscriptions:
      - topic: "mem.response"
        description: "Synthesized answers from the memory subsystem."
      - topic: "memory.maintenance.log"
        description: "Background cleanup activity surfacing in the chat."

  # === Memory proxy — natural-language gateway ===
  - type: memory-proxy
    name: memory-proxy
    description: "Receives natural language on mem.ask / mem.store, dispatches to KV + vector, synthesizes the response."
    priority: 5
    position: { x: 350, y: 350 }
    subscriptions:
      - topic: "mem.ask"
        description: "Natural-language memory query from chat."
      - topic: "mem.store"
        description: "Natural-language memory write from chat."
      - topic: "memory.result"
        description: "Replies from the KV store, used to synthesize an answer."
      - topic: "memory-vector.result"
        description: "Replies from the vector store, used to synthesize an answer."
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "mem.response"

  # === KV store — fast structured memory ===
  - type: memory
    name: kv-store
    description: "Persistent KV — facts, names, preferences."
    priority: 3
    position: { x: 650, y: 200 }
    subscriptions:
      - topic: "memory.store"
        description: "Store {key, value, tags?}."
      - topic: "memory.recall"
        description: "Recall by exact key."
      - topic: "memory.search"
        description: "Free-text search across keys, values, tags."
      - topic: "memory.update"
        description: "Update an entry's value or tags."
      - topic: "memory.delete"
        description: "Delete by key."
      - topic: "memory.list"
        description: "List entries, optionally filtered by tag."

  # === Vector store — semantic memory ===
  - type: memory-vector
    name: vector-store
    description: "LanceDB + Ollama embeddings for semantic / RAG-style search."
    priority: 3
    position: { x: 650, y: 500 }
    subscriptions:
      - topic: "memory-vector.store"
        description: "Embed and store a piece of text."
      - topic: "memory-vector.search"
        description: "Semantic similarity search."
      - topic: "memory-vector.index"
        description: "Index a directory of text/markdown files."
      - topic: "memory-vector.reindex"
        description: "Drop and rebuild the vector store."

  # === Cleanup agent — autonomous maintenance ===
  - type: memory-consolidator
    name: janitor
    description: "Watches memory.result, periodically merges duplicates / drops stale entries. Triggered by cron every 10 minutes."
    priority: 2
    position: { x: 350, y: 650 }
    subscriptions:
      - topic: "memory.result"
        description: "Observed to spot duplicates / stale entries."
      - topic: "memory.maintenance.tick"
        description: "Cron-driven heartbeat — kicks the cleanup pass."
    config_overrides:
      model: "ollama/gemma4:e4b"
      max_iterations: 8

  # === Periodic trigger for the janitor ===
  - type: cron
    name: cleanup-cron
    description: "Pings memory.maintenance.tick every 10 minutes so the janitor wakes up even when nothing else is happening."
    priority: 1
    position: { x: 50, y: 650 }
    config_overrides:
      topic: "memory.maintenance.tick"
      content: "scheduled cleanup"
      interval: "10m"
      criticality: 2
