# Default seed — the canonical "starter brAIn" network. Auto-applied
# on first boot when the DB is empty. The framework itself ships
# with NO nodes; everything below is fetched from the marketplace
# (tibzejoker/brAIn-store) and verified against pinned commit SHAs +
# per-file SHA-256 checksums before spawning.

needs:
  - type: brain
  - type: developer
  - type: chat
  - type: llm-basic
  - type: terminal
  - type: http-bridge
  - type: reminder
  - type: memory
  - type: memory-vector
  - type: memory-proxy
  - type: memory-consolidator

nodes:
  # === Human chat — the user talks here ===
  - type: chat
    name: human
    description: "Human chat interface. Messages go to the brain, responses come back."
    priority: 5
    position:
      x: 50
      y: 350
    subscriptions:
      - topic: "chat.response"
        description: "chat.response"
      - topic: "brain.output"
        description: "brain.output"
      - topic: "report.*"
        description: "report.*"
      - topic: "dev.result"
        description: "dev.result"
      - topic: "cmd.output"
        description: "cmd.output"
      - topic: "http.response"
        description: "http.response"
      - topic: "reminder.*"
        description: "reminder.*"
      - topic: "mem.response"
        description: "mem.response"

  # === Central brain — orchestrates everything ===
  - type: brain
    name: consciousness
    description: "Central intelligence. Receives human messages, delegates to other nodes, responds."
    priority: 10
    position:
      x: 450
      y: 350
    subscriptions:
      - topic: "chat.input"
        description: "chat.input"
      - topic: "alerts.*"
        description: "alerts.*"
      - topic: "report.*"
        description: "report.*"
      - topic: "dev.result"
        description: "dev.result"
      - topic: "cmd.output"
        description: "cmd.output"
      - topic: "http.response"
        description: "http.response"
      - topic: "reminder.*"
        description: "reminder.*"
      - topic: "mem.response"
        description: "mem.response"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "chat.response"
      idle_sleep: "1m"
      max_steps: 8

  # ── REASONING ──────────────────────────────

  # === Analyst — general purpose reasoning ===
  - type: llm-basic
    name: analyst
    description: "Reasoning agent. The brain sends it analysis tasks, it returns reports."
    priority: 5
    position:
      x: 850
      y: 150
    subscriptions:
      - topic: "task.analyze"
        description: "task.analyze"
    config_overrides:
      model: "ollama/gemma4:e4b"
      system_prompt: "You are an analyst. Answer questions precisely and concisely. Focus on facts."
      response_topic: "report.analysis"

  # === Developer — creates new node types ===
  - type: developer
    name: dev-agent
    description: "Creates new node types on demand. The brain asks it to build new capabilities."
    priority: 8
    position:
      x: 850
      y: 350
    subscriptions:
      - topic: "dev.request"
        description: "Author a brand-new node from a natural-language description."
      - topic: "dev.improve"
        description: "Improve an existing dev-authored node."
      - topic: "dev.workspaces.list"
        description: "List authored workspaces under nodes/_dynamic/."
      - topic: "dev.files.tree"
        description: "Inspect the file tree of one workspace."
      - topic: "dev.cli.list"
        description: "List code-authoring CLIs available."
      - topic: "dev.history.list"
        description: "List on-disk CLI transcripts (one per attempt)."
      - topic: "dev.history.read"
        description: "Read one transcript file."
      - topic: "dev.files.read"
        description: "Read the content of one file in an authored workspace."
      - topic: "dev.git.log"
        description: "List git commits (before/after each attempt) of a workspace."
      - topic: "dev.files.history"
        description: "List git commits touching one file in a workspace."
      - topic: "dev.files.diff"
        description: "Diff of one file at a given commit."
      - topic: "types.validation_failed"
        description: "Framework feedback when a workspace failed validation — triggers retry."
      - topic: "types.registered"
        description: "Framework signal that an authored workspace was registered — triggers auto-spawn."
      - topic: "types.updated"
        description: "Framework signal that an authored workspace's spec changed."
    config_overrides:
      cli: "claude"
      response_topic: "dev.result"
      timeout_ms: 300000
      # Handler timeout must clear the CLI's run time (claude -p needs
      # ~60-180s on a fresh node). Default 60s aborts mid-iteration and
      # types.registered then arrives to a sleeping/dead node.
      handler_timeout_ms: 600000

  # ── TOOLS ──────────────────────────────────

  # === Shell — runs system commands ===
  - type: terminal
    name: shell
    description: "Executes whitelisted shell commands for the brain."
    priority: 3
    position:
      x: 850
      y: 550
    subscriptions:
      - topic: "cmd.exec"
        description: "cmd.exec"
    config_overrides:
      response_topic: "cmd.output"
      timeout_ms: 15000
      allowed_commands: ["ls", "cat", "head", "tail", "wc", "date", "whoami", "df", "uptime", "git", "find", "grep"]

  # === HTTP bridge — fetches external APIs ===
  - type: http-bridge
    name: web-fetch
    description: "Fetches URLs and APIs for the brain."
    priority: 3
    position:
      x: 600
      y: 600
    subscriptions:
      - topic: "http.request"
        description: "http.request"
    config_overrides:
      response_topic: "http.response"

  # === Reminder — schedules timed alerts ===
  - type: reminder
    name: reminder
    description: "Schedules reminders. Send '30m Do the thing' on reminder.set, it fires when time is up."
    priority: 3
    position:
      x: 300
      y: 600
    subscriptions:
      - topic: "reminder.set"
        description: "reminder.set"

  # ── MEMORY ─────────────────────────────────

  # === Memory proxy — intelligent memory interface ===
  - type: memory-proxy
    name: memory-proxy
    description: "Intelligent memory gateway. Queries the right stores, synthesizes results. Can reorganize memories."
    priority: 5
    position:
      x: 200
      y: 150
    subscriptions:
      - topic: "mem.ask"
        description: "mem.ask"
      - topic: "mem.store"
        description: "mem.store"
      - topic: "memory.result"
        description: "memory.result"
      - topic: "memory-vector.result"
        description: "memory-vector.result"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "mem.response"

  # === Memory consolidator — autonomous maintenance agent ===
  - type: memory-consolidator
    name: memory-janitor
    description: "Periodically reviews, consolidates, and cleans up memories. Merges duplicates, removes stale entries."
    priority: 2
    position:
      x: -50
      y: 150
    subscriptions:
      - topic: "memory.result"
        description: "memory.result"
    config_overrides:
      model: "ollama/gemma4:e4b"
      max_iterations: 8

  # === Memory — persistent key-value store ===
  - type: memory
    name: memory
    description: "Fast key-value memory. Facts, names, preferences."
    priority: 3
    position:
      x: 50
      y: 50
    subscriptions:
      - topic: "memory.store"
        description: "memory.store"
      - topic: "memory.recall"
        description: "memory.recall"
      - topic: "memory.search"
        description: "memory.search"
      - topic: "memory.update"
        description: "memory.update"
      - topic: "memory.delete"
        description: "memory.delete"
      - topic: "memory.list"
        description: "memory.list"

  # === Vector memory — long-term semantic search ===
  - type: memory-vector
    name: long-term-memory
    description: "Vector memory with semantic search. Knowledge, documents, context."
    priority: 3
    position:
      x: 400
      y: 50
    subscriptions:
      - topic: "memory-vector.store"
        description: "memory-vector.store"
      - topic: "memory-vector.search"
        description: "memory-vector.search"
      - topic: "memory-vector.index"
        description: "memory-vector.index"
