# demo-needs — smallest possible interactive demo.
#
# Two nodes wired together so you can SEE needs[] auto-install in
# action: pick `demo.ping` from the chat's topic dropdown, type
# anything, the echo node bounces it back on `demo.pong` which the
# chat is subscribed to.
#
# What's interesting:
#   - `needs[]` ensures echo + chat are pulled from the marketplace
#     if not already local (lib brAIn-essentials + brAIn-ui).
#   - The whole network is two nodes — minimal proof that the
#     framework + marketplace + bus + chat all work end to end.

needs:
  - type: echo
  - type: chat

nodes:
  - type: chat
    name: human
    description: "Chat UI. Send to demo.ping (pick from the dropdown), see the bounce on demo.pong."
    priority: 5
    position: { x: 50, y: 250 }
    subscriptions:
      - topic: "demo.pong"
        description: "Echoed-back messages from the ping-pong node."

  - type: echo
    name: ping-pong
    description: "Trivial echo — anything on demo.ping comes back on demo.pong."
    priority: 1
    position: { x: 450, y: 250 }
    subscriptions:
      - topic: "demo.ping"
        description: "Anything you send here gets echoed back."
    config_overrides:
      response_topic: "demo.pong"
