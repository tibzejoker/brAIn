# Full conscience stack: perception (voice + gaze) → intent correlation →
# attention (LLM addressed-or-not gate) → brain (consciousness LLM) ↔ chat
# (human keyboard fallback / transcript view).
#
# Run via `pnpm dev:conscience`. Requires Ollama for the brain + attention
# LLMs; voice/gaze auto-detect GPU (cuda/mps) and fall back to CPU.
nodes:
  # ── PERCEPTION ────────────────────────────────────────────────
  - type: voice
    name: voice
    description: "Local STT + diarization (mic → voice.transcript)."
    priority: 5
    position: { x: 50, y: 200 }
    subscriptions:
      - topic: "voice.control"
      - topic: "voice.speaker.rename"
    config_overrides:
      response_topic: "voice.status"

  - type: gaze
    name: gaze
    description: "Local face detection + gaze direction (cam → gaze.target.resolved)."
    priority: 5
    position: { x: 50, y: 400 }
    subscriptions:
      - topic: "gaze.control"
      - topic: "gaze.face.rename"
    config_overrides:
      response_topic: "gaze.status"

  # ── CORRELATION ───────────────────────────────────────────────
  - type: intent
    name: intent
    description: "Correlator over voice + gaze. Emits intent.detected when a finalised utterance is paired with a gaze target."
    priority: 5
    position: { x: 400, y: 300 }
    subscriptions:
      - topic: "voice.transcript"
      - topic: "gaze.target.resolved"
      - topic: "intent.persons.create"
      - topic: "intent.persons.update"
      - topic: "intent.persons.delete"
    config_overrides:
      response_topic: "intent.detected"

  # ── ATTENTION (LLM gate) ──────────────────────────────────────
  # Reads intent.detected, asks the LLM "is the network being addressed?",
  # and forwards the addressed utterances onto brain.input.
  - type: attention
    name: attention
    description: "Decides whether the consciousness is being addressed and forwards the utterance to the brain."
    priority: 8
    position: { x: 750, y: 300 }

  # ── CONSCIOUSNESS (brain LLM) ─────────────────────────────────
  - type: brain
    name: consciousness
    description: "Central LLM. Reads typed (chat.input) and spoken-addressed (brain.input via attention) messages and replies."
    priority: 10
    position: { x: 1100, y: 300 }
    subscriptions:
      - topic: "brain.*"
      - topic: "chat.input"
      - topic: "intent.output"
      - topic: "alerts.*"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "chat.response"
      idle_sleep: "1m"
      max_steps: 6

  # ── HUMAN INTERFACE ───────────────────────────────────────────
  - type: chat
    name: human
    description: "Keyboard chat + transcript viewer. Type to bypass voice; replies and intent events surface here."
    priority: 5
    position: { x: 1100, y: 100 }
    subscriptions:
      - topic: "chat.response"
      - topic: "brain.output"
      - topic: "intent.output"
      - topic: "attention.response"
