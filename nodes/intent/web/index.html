<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>intent — who talks to whom</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>intent</h1>
      <nav class="subnav">
        <button id="mic-on" class="launch" title="Open the voice UI with the mic already armed">
          🎙 turn mic on
        </button>
        <button id="cam-on" class="launch" title="Open the gaze UI with the webcam already armed">
          📷 turn cam on
        </button>
        <a id="voice-link" href="#" target="_blank" rel="noopener">voice ↗</a>
        <a id="gaze-link" href="#" target="_blank" rel="noopener">gaze ↗</a>
      </nav>
      <div id="health" class="health"></div>
    </header>
    <main>
      <section class="panel persons">
        <header>
          <h2>Persons</h2>
          <button id="person-new">+ new</button>
        </header>
        <div id="persons-list"></div>
      </section>

      <section class="panel timeline">
        <header>
          <h2>Timeline <span class="hint">(last <span id="tl-window">60</span>s)</span></h2>
        </header>
        <div id="timeline-svg"></div>
      </section>

      <section class="panel intents">
        <header>
          <h2>Live intents</h2>
          <button id="intents-clear">clear</button>
        </header>
        <div id="intents-list"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
