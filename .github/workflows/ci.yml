name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same ref — only the latest matters for PR
# turnaround. `cancel-in-progress: true` is essential when the user
# pushes a fix-up commit before the previous CI finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test-framework:
    name: framework tests
    runs-on: ubuntu-latest
    # The framework tests (registry, remote-spawn) walk the workspace
    # and expect the 9 storeproject sibling repos to live at
    # ../storeprojects/brAIn-*/ relative to brAIn/. Recreate that
    # layout in CI by checking brAIn into a subdirectory and cloning
    # the storeprojects next to it.
    steps:
      - uses: actions/checkout@v4
        with:
          path: brAIn
      - name: Clone storeprojects siblings
        run: |
          mkdir -p storeprojects
          for repo in brAIn-essentials brAIn-games brAIn-bridges brAIn-demo-loneliness brAIn-llm brAIn-memory brAIn-perception brAIn-tools brAIn-ui; do
            git clone --depth 1 https://github.com/tibzejoker/$repo.git storeprojects/$repo
          done
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: brAIn/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: brAIn
      - run: pnpm test:framework
        working-directory: brAIn

  test-nodes:
    name: per-node tests (parallel)
    runs-on: ubuntu-latest
    # storeproject siblings live alongside brAIn — pnpm-workspace.yaml
    # globs ../storeprojects/brAIn-*/nodes/* but those repos aren't
    # checked out automatically in this single-repo CI. Until each
    # storeproject ships its own CI, run the in-tree node tests only.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=4 --if-present run test
